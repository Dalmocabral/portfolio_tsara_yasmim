    <!-- Limpeza de Service Workers e caches antigos de outros projetos em localhost -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
            console.log('[Tsara Yasmim] Service Worker antigo desregistrado.');
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
