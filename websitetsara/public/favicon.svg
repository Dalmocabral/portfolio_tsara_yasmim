<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Dourado Nobre -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4DC" />
      <stop offset="35%" stop-color="#DFBF75" />
      <stop offset="70%" stop-color="#B8934E" />
      <stop offset="100%" stop-color="#825E20" />
    </linearGradient>

    <!-- Gradiente Dourado Suave para Brilho -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8934E" />
      <stop offset="50%" stop-color="#FFF2CE" />
      <stop offset="100%" stop-color="#DFBF75" />
    </linearGradient>

    <!-- Fundo Profundo Místico -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A241C" />
      <stop offset="75%" stop-color="#16130F" />
      <stop offset="100%" stop-color="#0E0C0A" />
    </radialGradient>
  </defs>

  <!-- Fundo Circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />

  <!-- Aro Externo Dourado -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="1.5 2" opacity="0.8" />

  <!-- Raios da Roda Cigana Sagrada (16 raios sutis) -->
  <g stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4">
    <line x1="32" y1="7" x2="32" y2="57" />
    <line x1="7" y1="32" x2="57" y2="32" />
    <line x1="14.3" y1="14.3" x2="49.7" y2="49.7" />
    <line x1="14.3" y1="49.7" x2="49.7" y2="14.3" />
    <line x1="22.4" y1="8.6" x2="41.6" y2="55.4" />
    <line x1="8.6" y1="22.4" x2="55.4" y2="41.6" />
    <line x1="41.6" y1="8.6" x2="22.4" y2="55.4" />
    <line x1="8.6" y1="41.6" x2="55.4" y2="22.4" />
  </g>

  <!-- Estrela de 8 Pontas Central (Estrela do Oriente / Tradição Cigana) -->
  <!-- Pontas Menores (Diagonais) -->
  <polygon points="32,18 35,29 46,32 35,35 32,46 29,35 18,32 29,29" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Pontas Principais com Facetas de Luz -->
  <!-- Raio Norte -->
  <polygon points="32,10 32,32 36,28" fill="url(#goldLight)" />
  <polygon points="32,10 32,32 28,28" fill="url(#goldGrad)" />

  <!-- Raio Sul -->
  <polygon points="32,54 32,32 28,36" fill="url(#goldLight)" />
  <polygon points="32,54 32,32 36,36" fill="url(#goldGrad)" />

  <!-- Raio Leste -->
  <polygon points="54,32 32,32 36,28" fill="url(#goldLight)" />
  <polygon points="54,32 32,32 36,36" fill="url(#goldGrad)" />

  <!-- Raio Oeste -->
  <polygon points="10,32 32,32 28,36" fill="url(#goldLight)" />
  <polygon points="10,32 32,32 28,28" fill="url(#goldGrad)" />

  <!-- Centro Sagrado Radiante -->
  <circle cx="32" cy="32" r="4.2" fill="#0E0C0A" />
  <circle cx="32" cy="32" r="3.2" fill="url(#goldLight)" />
  <circle cx="32" cy="32" r="1.3" fill="#FFF9E6" />
</svg>